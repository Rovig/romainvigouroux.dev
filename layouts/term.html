{{ define "main" }}
<section class="list-page">
  <nav class="g4 crumbs" aria-label="{{ i18n "breadcrumb" }}"><p class="span4"><a href="{{ site.Home.RelPermalink }}">{{ lower (i18n "home") }}</a> / <a href="{{ .Parent.RelPermalink }}">{{ lower (i18n "topics") }}</a></p></nav>
  <header class="g4 titleband"><h1 class="span3">{{ i18n "topic_prefix" }} {{ .Title }}</h1><p class="num">{{ len .Pages }}</p><p class="lede span3">{{ i18n "topic_intro" }} {{ .Title }}.</p></header>
  {{ partial "post-list.html" .Pages }}
</section>
{{ end }}
