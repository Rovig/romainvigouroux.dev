{{ define "main" }}
<section class="list-page">
  <nav class="g4 crumbs" aria-label="{{ i18n "breadcrumb" }}"><p class="span4"><a href="{{ site.Home.RelPermalink }}">{{ lower (i18n "home") }}</a> / {{ lower (i18n "topics") }}</p></nav>
  <header class="g4 titleband"><h1 class="span3">{{ i18n "topics" }}</h1><p class="num">{{ len .Data.Terms }}</p></header>
  <ul class="g4 topics">
  {{- range .Data.Terms.ByCount }}<li><a href="{{ .Page.RelPermalink }}"><span>{{ lower .Page.LinkTitle }}</span><span class="topic-count">{{ .Count }}</span></a></li>
  {{- else }}<li class="muted">{{ i18n "no_topics" }}</li>{{ end }}
  </ul>
</section>
{{ end }}
