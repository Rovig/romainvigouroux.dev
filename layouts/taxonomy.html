{{ define "main" }}
<section class="wrap">
  <nav class="crumbs" aria-label="{{ i18n "breadcrumb" }}"><a href="{{ site.Home.RelPermalink }}">{{ i18n "home" }}</a> / {{ i18n "topics" }}</nav>
  <h1>{{ i18n "topics" }}</h1>
  <ul class="tag-cloud">
  {{- range .Data.Terms.ByCount }}<li><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }} <span>{{ .Count }}</span></a></li>
  {{- else }}<li class="muted">{{ i18n "no_topics" }}</li>{{ end }}
  </ul>
</section>
{{ end }}
