{{ define "main" }}
<section class="wrap">
  <nav class="crumbs" aria-label="{{ i18n "breadcrumb" }}"><a href="{{ site.Home.RelPermalink }}">{{ i18n "home" }}</a> / {{ .Title }}</nav>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  {{ partial "post-list.html" .Pages }}
</section>
{{ end }}
